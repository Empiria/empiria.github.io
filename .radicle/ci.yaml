version: "1"
project: "empiria-website"
description: "Empiria website built with Hugo and deployed to Swarm"

build:
  # Node 24: newer Hugo runs PostCSS under node --permission, which Node 22
  # rejects. Same Node and Hugo as .github/workflows/gh-pages.yml.
  image: "docker.io/node:24-bookworm"
  cache: true
  # Install Hugo 0.167.0 extended (with SCSS support) and build with npm
  commands:
    - curl -fL https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-arm64.deb -o /tmp/hugo.deb && dpkg -i /tmp/hugo.deb && rm /tmp/hugo.deb
    - npm install
    - npm run build
    - mkdir -p /artifacts && cp -r public/* /artifacts/

env:
  HUGO_ENVIRONMENT: "production"

artifacts:
  - path: "/src/public"
    name: "hugo-website"
    type: "archive"

deploy:
  enabled: true
  image: "debian:bookworm-slim"
  environment:
    SWARM_IDENTITY: "empiria-website"
    SWARM_TOPIC: "empiria-website-main"
  ports: []
  volumes:
    - "/data/.env:/home/deploy/.env:ro"
  command:
    - "/bin/sh"
    - "-c"
    - |
      # Install swarm-cli dependencies
      apt-get update && apt-get install -y nodejs npm ca-certificates curl && \
      npm install -g @ethersphere/swarm-cli && \
      # Load environment variables
      . /home/deploy/.env && \
      # Deploy to Swarm with artifact
      swarm-cli feed upload /artifacts/hugo-website \
        --identity "$SWARM_IDENTITY" \
        --topic-string "$SWARM_TOPIC" \
        --stamp "$SWARM_BATCH_ID" \
        --index-document index.html \
        --error-document 404.html \
        --pin

post_deploy:
  - name: "verify-deployment"
    script: |
      swarm-cli feed print --identity "empiria-website" --topic-string "empiria-website-main"
    timeout: "30s"

notifications:
  webhook: "https://api.example.com/ci/webhooks"
