# The real address, so the sitemap, canonical links and og:url/og:image are
# absolute (search engines and link previews ignore relative ones). Links and
# assets in the HTML stay relative through relativeURLs, so the same build
# also works from Swarm gateways, which serve it under other hosts. A wrong
# host here (empiria.github.io) caused the January CORS breakage.
baseURL = "https://empiria.co.uk/"
relativeURLs = true
# No tag or category pages: the blog is too small for them to be useful.
disableKinds = ["taxonomy", "term"]
title = "Empiria"
theme = "hugoplate"
timeZone = "Europe/London"
summaryLength = 10 # see https://gohugo.io/content-management/excerpts/

[pagination]
pagerSize = 12 # see https://gohugo.io/extras/pagination/
disableLanguages = [] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

########################### Services #############################
[services]
# [services.googleAnalytics]
# ID = 'G-MEASUREMENT_ID' # see https://gohugo.io/templates/internal/#configure-google-analytics

# [services.disqus]
# shortname = 'themefisher-template' # we use disqus to show comments in blog posts . To install disqus please follow this tutorial https://portfolio.peter-baumgartner.net/2017/09/10/how-to-install-disqus-on-hugo/

########################## Permalinks ############################
[permalinks]
page = "/:slug/"


############################# Modules ############################
[module]
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/watching/hugo_stats.json"

############################# Build ##############################
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/watching/hugo_stats\.json'
target = 'style\.css'
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = 'js'
[[build.cachebusters]]
source = 'assets/.*\.(css|scss|sass)'
target = 'css'
[[build.cachebusters]]
source = 'data/.*\.(.*)$'
target = 'css'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'


############################# Outputs ############################
[outputs]
home = ["HTML", "RSS", "SearchIndex"]

############################# Imaging ############################
[imaging]
# See https://github.com/disintegration/imaging
resampleFilter = "Lanczos"
# JPEG and WebP quality; Hugo's default is 75. Set per format since Hugo
# 0.163, which deprecated the single imaging.quality.
[imaging.jpeg]
quality = 80
[imaging.webp]
quality = 80

############################ Caches ##############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true


########################### Output Format ##########################
[outputFormats]
[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true

########################### PostCSS ##########################
# PostCSS is configured via postcss.config.js
# This tells Hugo to use PostCSS for CSS processing when css.PostCSS is called in templates
# go and git are needed by `hugo mod get`, which the GitHub Pages workflow runs.
[security.exec]
allow = ["^(go|git|postcss|npm|node)$"]

############################# Plugins ##############################

# JS Plugins
[[params.plugins.js]]
link = "plugins/cookie.js"
lazy = false
[[params.plugins.js]]
link = "plugins/youtube-lite.js"
lazy = true
